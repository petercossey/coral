{{#if categories}}
<nav class="border-t border-slate-200 bg-slate-100" aria-label="Product categories">
    <ul class="flex w-full items-center gap-3 overflow-x-auto px-4 py-1 sm:px-6 lg:px-8 xl:px-10">
        {{#each categories}}
            <li class="shrink-0">
                <a
                    href="{{url}}"
                    class="block rounded px-3 py-1 text-base font-semibold leading-6 {{#if is_active}}text-slate-950 underline{{else}}text-slate-700 hover:text-slate-950{{/if}} focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 focus:ring-offset-slate-100"
                    aria-label="{{name}}"
                >
                    {{name}}
                </a>
            </li>
        {{/each}}
    </ul>
</nav>
{{/if}}
