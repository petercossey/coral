<a
    href="{{#if customer}}{{urls.account.index}}{{else}}{{urls.auth.login}}{{/if}}"
    class="inline-flex min-h-14 items-center gap-2 rounded border border-transparent bg-white px-2.5 py-1.5 text-slate-950 hover:border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
    aria-label="{{#if customer}}View your account{{else}}Sign in to your account{{/if}}"
>
    <svg
        class="h-5 w-5 shrink-0 text-slate-700"
        aria-hidden="true"
        fill="none"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
    >
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.75" />
        <path d="M4 21a8 8 0 0 1 16 0" stroke="currentColor" stroke-linecap="round" stroke-width="1.75" />
    </svg>
    <span class="flex flex-col items-start">
        <span class="text-[0.8125rem] font-normal leading-tight text-slate-600">{{#if customer}}Hello!{{else}}Sign In{{/if}}</span>
        <span class="text-base font-semibold leading-tight">Account</span>
    </span>
</a>
