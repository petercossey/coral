<a
    href="{{urls.cart}}"
    class="inline-flex items-center gap-2 rounded border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-950 transition hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
    data-cart-drawer-trigger
    aria-label="Open cart, {{#if cart.quantity}}{{cart.quantity}}{{else}}0{{/if}} items"
>
    <span aria-hidden="true">Cart</span>
    <span
        class="inline-flex min-w-6 items-center justify-center rounded bg-slate-950 px-2 py-0.5 text-xs font-semibold text-white"
    >{{#if cart.quantity}}{{cart.quantity}}{{else}}0{{/if}}</span>
</a>
