<header class="relative border-b border-slate-200 bg-white">
    <div class="mx-auto grid max-w-6xl gap-4 px-6 py-4 md:grid-cols-[minmax(8rem,1fr)_minmax(18rem,2fr)_minmax(8rem,1fr)] md:items-center">
        <div class="flex items-center">
            <a href="{{urls.home}}" class="text-lg font-semibold text-slate-950">
                {{#if settings.store_logo.title}}{{settings.store_logo.title}}{{else}}Coral{{/if}}
            </a>
        </div>
        <div class="w-full">
            {{> components/header/search-form urls=urls forms=forms}}
        </div>
        <div class="flex items-center md:justify-end">
            {{> components/header/cart-link urls=urls cart=cart}}
        </div>
    </div>
    {{#if page_type '===' 'default'}}
        {{> components/search-preview/search-preview}}
    {{/if}}
</header>
