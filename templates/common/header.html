<header class="relative border-b border-slate-200 bg-white">
    <div class="grid w-full gap-4 px-4 py-2 sm:px-6 md:grid-cols-[minmax(11rem,1fr)_minmax(18rem,54rem)_minmax(11rem,1fr)] md:items-center lg:px-8 xl:px-10">
        <div class="flex items-center">
            <a href="{{urls.home}}" class="text-lg font-semibold text-slate-950">
                {{#if settings.store_logo.title}}{{settings.store_logo.title}}{{else}}Coral{{/if}}
            </a>
        </div>
        <div class="w-full">
            {{> components/header/search-form urls=urls forms=forms}}
        </div>
        <div class="flex items-center gap-4 md:justify-end">
            {{> components/header/account-link urls=urls}}
            {{> components/header/cart-link urls=urls cart=cart}}
        </div>
    </div>
    {{#if page_type '===' 'default'}}
        <div data-coral-component="search-preview"></div>
    {{/if}}
</header>
