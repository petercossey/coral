<!DOCTYPE html>
<html lang="{{ locale_name }}">
<head>
    <meta charset="utf-8">
    <title>{{ head.title }}</title>
    {{{ head.meta_tags }}}
    {{{ head.config }}}
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="{{ head.favicon }}" rel="shortcut icon">
    {{!-- Chrome-free pages do not load the theme stylesheet. Keep only the
         visually-hidden utility Coral uses for accessible headings. --}}
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
    {{#block "head"}}{{/block}}
</head>
<body>
    {{#block "page"}}{{/block}}
</body>
</html>
